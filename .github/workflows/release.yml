name: Build and release installers

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(tr -d '\r' < VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'VERSION must contain a stable version number such as 1.0.0.' >&2
            exit 1
          fi
          tag="v$version"
          state=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq \
            ".[] | select(.tag_name == \"$tag\") |
              if .draft == false then \"published\"
              elif .author.login == \"github-actions[bot]\" then \"draft\"
              else \"manual\" end")
          case "$state" in
            published) echo "$tag is already published."; exit 0 ;;
            ''|draft) ;;
            *) echo "Resolve the existing draft for $tag before releasing it from Actions." >&2; exit 1 ;;
          esac
          ref="refs/tags/$tag"
          tag_sha=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq \
            ".[] | select(.ref == \"$ref\") | .object.sha")
          if [[ -z "$tag_sha" && "$state" != draft ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="$ref" -f sha="$GITHUB_SHA" >/dev/null
          elif [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "$tag must point to the commit used to build these installers." >&2
            exit 1
          fi
          if [[ "$state" != draft ]]; then
            gh release create "$tag" --draft --verify-tag --title "Bloodborne Thai $tag" --generate-notes
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} x64
    needs: prepare
    permissions:
      contents: write
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-2022
            asset: bloodborne-thai-windows-x64.zip
          - platform: Linux
            runner: ubuntu-22.04
            asset: bloodborne-thai-linux-x64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Package and launch Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build.ps1
          Expand-Archive -LiteralPath 'out/${{ matrix.asset }}' -DestinationPath release-test
          if ((Get-Content -Raw VERSION) -cne (Get-Content -Raw release-test/VERSION)) {
            throw 'Packaged VERSION does not match the source.'
          }
          foreach ($notice in 'LICENSE', 'OFL.txt', 'licenses/Python.txt', 'licenses/fontTools.txt') {
            if (!(Get-Content -Raw -LiteralPath "release-test/$notice")) {
              throw "Missing license notice $notice."
            }
          }
          '' | & ./release-test/bloodborne-thai.exe
          exit $LASTEXITCODE
      - name: Package and launch Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash build.sh
          mkdir release-test
          tar -xzf 'out/${{ matrix.asset }}' -C release-test
          cmp VERSION release-test/VERSION
          for notice in LICENSE OFL.txt licenses/Python.txt licenses/fontTools.txt licenses/zlib.txt; do
            test -s "release-test/$notice"
          done
          printf '\n' | ./release-test/bloodborne-thai
      - name: Upload installer to draft release
        if: needs.prepare.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ASSET: ${{ matrix.asset }}
        run: gh release upload "$TAG" "out/$ASSET" --clobber

  release:
    name: Publish GitHub Release
    if: needs.prepare.outputs.tag != ''
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish installers and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          windows=bloodborne-thai-windows-x64.zip
          linux=bloodborne-thai-linux-x64.tar.gz
          gh release download "$TAG" --pattern "$windows" --pattern "$linux"
          sha256sum "$windows" "$linux" > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false
